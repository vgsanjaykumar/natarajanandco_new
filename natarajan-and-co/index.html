    <!-- The site runs in a single (dark) theme — data-theme="dark" is set
         directly on <html> above, so there's nothing to compute before first
         paint. This only handles skipping the splash on repeat visits. -->
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("splash-seen")) document.documentElement.className += " no-splash";
        } catch (e) {}
      })();

    <!-- Critical CSS for the logo splash: inline, so the logo appears
         instantly and nothing extra has to be downloaded first. -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#FAF9F5;color:#0F1115;transition:opacity .5s ease,visibility .5s}
      html[data-theme="dark"] #splash{background:#0C0D10;color:#F4F3EE}
      #splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      .no-splash #splash{display:none}
      #splash .sp-logo{width:72px;height:72px;border-radius:16px;background:#fff;box-shadow:0 12px 40px -12px rgba(0,0,0,.45);animation:sp-in .6s cubic-bezier(.2,.7,.2,1) both}
      #splash .sp-name{font:800 22px/1.1 "Plus Jakarta Sans Variable","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.015em;animation:sp-in .6s .12s cubic-bezier(.2,.7,.2,1) both}
      #splash .sp-sub{font:600 10.5px/1 "Plus Jakarta Sans Variable","Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-top:-6px;animation:sp-in .6s .2s cubic-bezier(.2,.7,.2,1) both}
      #splash .sp-bar{width:148px;height:3px;border-radius:3px;background:rgba(127,127,127,.22);overflow:hidden;margin-top:6px}
      #splash .sp-bar i{display:block;height:100%;background:#FFE500;transform:translateX(-100%);animation:sp-bar 1s .15s cubic-bezier(.6,0,.2,1) forwards}
      @keyframes sp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes sp-bar{to{transform:none}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .sp-bar i{transform:none}}
    </style>
